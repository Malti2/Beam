name: Beam
options:
  bundleIdPrefix: de.malte
targets:
  Beam:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Beam
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.beam
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_FILE: Sources/Beam/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
