name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        run: ./Scripts/build.sh "${{ steps.version.outputs.value }}" "${{ github.run_number }}"

      - name: Package
        run: /usr/bin/ditto -c -k --sequesterRsrc --keepParent Beam.app Beam.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beam-${{ steps.version.outputs.value }}
          path: Beam.zip
          retention-days: 1

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Beam.zip \
            --title "Beam ${{ steps.version.outputs.value }}" \
            --notes "Unsigned build for Apple Silicon and Intel Macs (macOS 13+). First launch: right-click the app and choose Open."
